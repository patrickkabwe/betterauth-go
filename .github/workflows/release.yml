name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - run: go test -race -count=1 ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build CLI binaries
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          platforms=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "windows/arm64"
          )
          for platform in "${platforms[@]}"; do
            GOOS="${platform%/*}"
            GOARCH="${platform#*/}"
            BIN="betterauth-${GOOS}-${GOARCH}"
            if [ "$GOOS" = "windows" ]; then
              BIN="${BIN}.exe"
            fi
            echo "Building ${BIN}..."
            GOOS="$GOOS" GOARCH="$GOARCH" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/${BIN}" \
              ./cli
          done
          (cd dist && sha256sum betterauth-* > SHA256SUMS)

      - name: Verify CLI install path
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          go build -o "$(go env GOPATH)/bin/betterauth" \
            -ldflags "-s -w -X main.version=${VERSION}" ./cli
          betterauth --version

      - name: Generate release notes
        id: notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PREV_TAG="$(git tag -l 'v*' --sort=-version:refname | grep -Fxv "$TAG" | head -1 || true)"

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${TAG}"
          else
            RANGE="${TAG}"
          fi

          {
            echo "## Better Auth for Go ${VERSION}"
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "Changes since [\`${PREV_TAG}\`](https://github.com/${{ github.repository }}/releases/tag/${PREV_TAG}):"
            else
              echo "First stable release of **betterauth-go** — a Go server compatible with Better Auth clients."
            fi
            echo
            if [ -n "$PREV_TAG" ]; then
              LOG_ARGS=( "${RANGE}" )
            else
              LOG_ARGS=( "${RANGE}" --merges --reverse )
            fi
            CHANGE_COUNT="$(git rev-list --count "${LOG_ARGS[@]}" 2>/dev/null || echo 0)"
            if [ "${CHANGE_COUNT}" -gt 0 ]; then
              echo "### What's new"
              echo
              git log "${LOG_ARGS[@]}" --pretty=format:'- %s (%h)'
              echo
              echo
            else
              echo "_No changes in this release._"
              echo
            fi
            echo "## Install"
            echo
            echo "**Go module** (library + CLI):"
            echo '```bash'
            echo "go get github.com/patrickkabwe/betterauth-go@${TAG}"
            echo "go install github.com/patrickkabwe/betterauth-go/cli@${TAG}"
            echo "betterauth --version"
            echo '```'
            echo
            echo "**Prebuilt CLI** — download the binary for your platform below, then:"
            echo '```bash'
            echo "chmod +x betterauth-<platform>   # macOS / Linux"
            echo "./betterauth-<platform> secret"
            echo '```'
            echo
            echo "## Assets"
            echo
            echo "| Platform | Binary |"
            echo "|----------|--------|"
            echo "| macOS (Apple Silicon) | \`betterauth-darwin-arm64\` |"
            echo "| macOS (Intel) | \`betterauth-darwin-amd64\` |"
            echo "| Linux (amd64) | \`betterauth-linux-amd64\` |"
            echo "| Linux (arm64) | \`betterauth-linux-arm64\` |"
            echo "| Windows (amd64) | \`betterauth-windows-amd64.exe\` |"
            echo "| Windows (arm64) | \`betterauth-windows-arm64.exe\` |"
            echo
            echo "Verify downloads with \`SHA256SUMS\`."
            echo
            echo "**Full changelog:** https://github.com/${{ github.repository }}/commits/${TAG}"
          } > release-notes.md

          echo "path=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "${{ steps.notes.outputs.path }}" \
            dist/*

      - name: Summary
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Release ${{ steps.version.outputs.tag }}

          Go module (all packages share this tag):

          \`\`\`bash
          go get github.com/patrickkabwe/betterauth-go@${{ steps.version.outputs.tag }}
          go build -o "$(go env GOPATH)/bin/betterauth" github.com/patrickkabwe/betterauth-go/cli@${{ steps.version.outputs.tag }}
          betterauth --version
          \`\`\`

          Import paths released under this tag:

          | Package | Import path |
          |---------|-------------|
          | Core auth | \`github.com/patrickkabwe/betterauth-go/auth\` |
          | CLI (library) | \`github.com/patrickkabwe/betterauth-go/cli/core\` |
          | Go HTTP client | \`github.com/patrickkabwe/betterauth-go/client\` |
          | Plugins | \`github.com/patrickkabwe/betterauth-go/plugins\` |
          | Memory store | \`github.com/patrickkabwe/betterauth-go/store/memory\` |
          | SQL store | \`github.com/patrickkabwe/betterauth-go/store/sql\` |
          | CLI binary | \`github.com/patrickkabwe/betterauth-go/cli\` (install with \`go build -o …/bin/betterauth\`) |

          pkg.go.dev will index the tag automatically within a few minutes.
          EOF
