name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - run: go test -race -count=1 ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build CLI binaries
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          platforms=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "windows/arm64"
          )
          for platform in "${platforms[@]}"; do
            GOOS="${platform%/*}"
            GOARCH="${platform#*/}"
            BIN="betterauth-go-${GOOS}-${GOARCH}"
            if [ "$GOOS" = "windows" ]; then
              BIN="${BIN}.exe"
            fi
            echo "Building ${BIN}..."
            GOOS="$GOOS" GOARCH="$GOARCH" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/${BIN}" \
              .
          done
          (cd dist && sha256sum betterauth-go-* > SHA256SUMS)

      - name: Verify CLI install path
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          go build -o "$(go env GOPATH)/bin/betterauth-go" \
            -ldflags "-s -w -X main.version=${VERSION}" .
          betterauth-go --version

      - name: Generate release notes
        id: notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV_TAG="$(git tag -l 'v*' --sort=-version:refname | grep -Fxv "$TAG" | head -1 || true)"

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${TAG}"
          else
            RANGE="${TAG}"
          fi

          LOG_ARGS=( "${RANGE}" --reverse )
          RELEASE_DATE="$(date -u +%Y-%m-%d)"
          SECTIONS_DIR="$(mktemp -d)"
          CONVENTIONAL_COMMIT_RE='^([a-z]+)(\([^)]+\))?(!)?:[[:space:]](.+)$'

          section_file() {
            case "$1" in
              feat) echo "${SECTIONS_DIR}/features.md" ;;
              fix) echo "${SECTIONS_DIR}/bug-fixes.md" ;;
              perf) echo "${SECTIONS_DIR}/performance.md" ;;
              refactor) echo "${SECTIONS_DIR}/refactoring.md" ;;
              docs) echo "${SECTIONS_DIR}/documentation.md" ;;
              build) echo "${SECTIONS_DIR}/build.md" ;;
              ci) echo "${SECTIONS_DIR}/ci.md" ;;
              test) echo "${SECTIONS_DIR}/tests.md" ;;
              style) echo "${SECTIONS_DIR}/styles.md" ;;
              chore) echo "${SECTIONS_DIR}/chores.md" ;;
              revert) echo "${SECTIONS_DIR}/reverts.md" ;;
              *) return 1 ;;
            esac
          }

          append_section() {
            local title="$1"
            local file="$2"
            if [ ! -s "$file" ]; then
              return 0
            fi
            echo "### ${title}"
            echo
            cat "$file"
            echo
          }

          git log "${LOG_ARGS[@]}" --format='%H%x1f%h%x1f%s%x1e' |
            while IFS=$'\x1f' read -r -d $'\x1e' hash short_hash subject; do
              hash="${hash//$'\n'/}"
              short_hash="${short_hash//$'\n'/}"
              subject="${subject//$'\n'/}"
              if [[ ! "$subject" =~ $CONVENTIONAL_COMMIT_RE ]]; then
                continue
              fi

              type="${BASH_REMATCH[1]}"
              scope="${BASH_REMATCH[2]}"
              breaking="${BASH_REMATCH[3]}"
              description="${BASH_REMATCH[4]}"
              file="$(section_file "$type" || true)"
              if [ -z "$file" ]; then
                continue
              fi

              scope="${scope#(}"
              scope="${scope%)}"
              if [ -n "$scope" ]; then
                entry="* **${scope}:** ${description} ([${short_hash}](https://github.com/${REPOSITORY}/commit/${hash}))"
              else
                entry="* ${description} ([${short_hash}](https://github.com/${REPOSITORY}/commit/${hash}))"
              fi

              echo "$entry" >> "$file"
              if [ -n "$breaking" ] || git log -1 --format=%B "$hash" | grep -Eq '^BREAKING[ -]CHANGE:'; then
                echo "$entry" >> "${SECTIONS_DIR}/breaking.md"
              fi
            done

          CONVENTIONAL_CHANGE_COUNT="$(
            find "$SECTIONS_DIR" -type f -name '*.md' -exec cat {} + 2>/dev/null |
              wc -l |
              tr -d ' '
          )"

          CONTRIBUTORS_TSV="${SECTIONS_DIR}/contributors.tsv"
          if [ -n "$PREV_TAG" ]; then
            gh api "repos/${REPOSITORY}/compare/${PREV_TAG}...${TAG}" \
              --jq '.commits[].author | select(. != null) | [.login, .html_url, .avatar_url] | @tsv' \
              > "$CONTRIBUTORS_TSV" || true
          else
            git log "${LOG_ARGS[@]}" --format='%H' |
              while read -r commit_hash; do
                gh api "repos/${REPOSITORY}/commits/${commit_hash}" \
                  --jq '.author | select(. != null) | [.login, .html_url, .avatar_url] | @tsv' || true
              done > "$CONTRIBUTORS_TSV"
          fi

          sort -u "$CONTRIBUTORS_TSV" -o "$CONTRIBUTORS_TSV"
          if [ -s "$CONTRIBUTORS_TSV" ]; then
            {
              echo '<p align="left">'
              while IFS=$'\t' read -r login profile_url avatar_url; do
                if [ -n "$login" ] && [ -n "$profile_url" ] && [ -n "$avatar_url" ]; then
                  echo "  <a href=\"${profile_url}\"><img src=\"${avatar_url}\" width=\"48\" height=\"48\" alt=\"@${login}\" title=\"@${login}\" /></a>"
                fi
              done < "$CONTRIBUTORS_TSV"
              echo '</p>'
            } > "${SECTIONS_DIR}/contributors.md"
          fi

          {
            if [ -n "$PREV_TAG" ]; then
              echo "## [${VERSION}](https://github.com/${REPOSITORY}/compare/${PREV_TAG}...${TAG}) (${RELEASE_DATE})"
            else
              echo "## ${VERSION} (${RELEASE_DATE})"
            fi
            echo
            if [ "${CONVENTIONAL_CHANGE_COUNT}" -gt 0 ]; then
              append_section "Breaking Changes" "${SECTIONS_DIR}/breaking.md"
              append_section "Features" "${SECTIONS_DIR}/features.md"
              append_section "Bug Fixes" "${SECTIONS_DIR}/bug-fixes.md"
              append_section "Performance Improvements" "${SECTIONS_DIR}/performance.md"
              append_section "Code Refactoring" "${SECTIONS_DIR}/refactoring.md"
              append_section "Documentation" "${SECTIONS_DIR}/documentation.md"
              append_section "Build System" "${SECTIONS_DIR}/build.md"
              append_section "Continuous Integration" "${SECTIONS_DIR}/ci.md"
              append_section "Tests" "${SECTIONS_DIR}/tests.md"
              append_section "Styles" "${SECTIONS_DIR}/styles.md"
              append_section "Chores" "${SECTIONS_DIR}/chores.md"
              append_section "Reverts" "${SECTIONS_DIR}/reverts.md"
            else
              echo "_No conventional commits in this release._"
              echo
            fi
            append_section "Contributors" "${SECTIONS_DIR}/contributors.md"
          } > release-notes.md

          echo "path=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "${{ steps.notes.outputs.path }}" \
            dist/*

      - name: Summary
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Release ${{ steps.version.outputs.tag }}

          Go module (all packages share this tag):

          \`\`\`bash
          go get github.com/patrickkabwe/betterauth-go@${{ steps.version.outputs.tag }}
          go install github.com/patrickkabwe/betterauth-go@${{ steps.version.outputs.tag }}
          betterauth-go --version
          \`\`\`

          Import paths released under this tag:

          | Package | Import path |
          |---------|-------------|
          | Core auth | \`github.com/patrickkabwe/betterauth-go/auth\` |
          | CLI (library) | \`github.com/patrickkabwe/betterauth-go/cli/core\` |
          | Go HTTP client | \`github.com/patrickkabwe/betterauth-go/client\` |
          | Plugins | \`github.com/patrickkabwe/betterauth-go/plugins\` |
          | Memory store | \`github.com/patrickkabwe/betterauth-go/store/memory\` |
          | SQL store | \`github.com/patrickkabwe/betterauth-go/store/sql\` |
          | CLI binary | \`go install github.com/patrickkabwe/betterauth-go@tag\` → \`betterauth-go\` |

          pkg.go.dev will index the tag automatically within a few minutes.
          EOF
